# Traefik v3 in front of fluid-agent:
#   https://hooks.example.com/...        -> webhooks + ingest (subdomain)
#   https://example.com/console/...      -> console (path, StripPrefix; the agent reads X-Forwarded-Prefix)
#   example.com:8080 (TCP)               -> forward proxy (CONNECT needs TCP passthrough)
# fluid-agent config.json: "admin_addr": ":9000", "trusted_proxies": ["172.30.0.0/24"]
services:
  traefik:
    image: docker.io/library/traefik:latest
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
      - --entrypoints.proxy.address=:8080
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=ops@example.com
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
    ports: ["443:443", "8080:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
    networks: [edge]

  fluid-agent:
    build: ../..                      # repository root
    volumes:
      - ./config.json:/app/config.json:ro
      - ./dynamic:/app/dynamic
      - data:/app/data
    networks: [edge]
    labels:
      - traefik.enable=true
      # webhooks on a subdomain
      - traefik.http.routers.hooks.rule=Host(`hooks.example.com`)
      - traefik.http.routers.hooks.entrypoints=websecure
      - traefik.http.routers.hooks.tls.certresolver=le
      - traefik.http.routers.hooks.service=hooks
      - traefik.http.services.hooks.loadbalancer.server.port=8081
      # console under a path, prefix stripped
      - traefik.http.routers.console.rule=Host(`example.com`) && PathPrefix(`/console`)
      - traefik.http.routers.console.entrypoints=websecure
      - traefik.http.routers.console.tls.certresolver=le
      - traefik.http.routers.console.middlewares=console-strip,console-ip
      - traefik.http.routers.console.service=console
      - traefik.http.middlewares.console-strip.stripprefix.prefixes=/console
      - traefik.http.middlewares.console-ip.ipallowlist.sourcerange=10.0.0.0/8
      - traefik.http.services.console.loadbalancer.server.port=9000
      # forward proxy: raw TCP
      - traefik.tcp.routers.fwd.rule=HostSNI(`*`)
      - traefik.tcp.routers.fwd.entrypoints=proxy
      - traefik.tcp.routers.fwd.service=fwd
      - traefik.tcp.middlewares.fwd-ip.ipallowlist.sourcerange=203.0.113.0/24
      - traefik.tcp.routers.fwd.middlewares=fwd-ip
      - traefik.tcp.services.fwd.loadbalancer.server.port=8080

volumes: { acme: {}, data: {} }
networks:
  edge:
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
