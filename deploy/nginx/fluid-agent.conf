# Public TLS front for the webhook/ingest listener (:8081).
# config.json must list this proxy in "trusted_proxies" (e.g. ["127.0.0.1"]) so
# sender IPs are read correctly from X-Forwarded-For.
server {
    listen 443 ssl http2;
    server_name hooks.example.com;

    ssl_certificate     /etc/letsencrypt/live/hooks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooks.example.com/privkey.pem;

    client_max_body_size 10m;          # keep in line with max_body_bytes

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        # Overwrite (do not append to) client-supplied values.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
# The admin UI/API (:9000) should not be exposed publicly. Reach it with:
#   ssh -L 9000:127.0.0.1:9000 you@server   ->   http://localhost:9000
