# nginx in front of fluid-agent. Pick the blocks you need.
# fluid-agent config.json for this file:
#   "trusted_proxies": ["127.0.0.1"],          # nginx's address as the agent sees it
#   "admin_base_path": "/console",             # only for layout B
#   "webhook_base_path": "/hooks-gw"           # only for layout B, location without stripping

# ---------- A) subdomains (root path) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name hooks.example.com;                       # webhooks + ingest
    ssl_certificate     /etc/letsencrypt/live/hooks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooks.example.com/privkey.pem;
    client_max_body_size 10m;                            # >= max_body_bytes

    location / {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/snippets/fluid-proxy.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name console.example.com;                     # UI + API (restrict access!)
    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
    allow 10.0.0.0/8; deny all;                          # e.g. VPN only

    location / {
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/snippets/fluid-proxy.conf;
    }
}

# ---------- B) one domain, paths ----------
server {
    listen 443 ssl;
    http2 on;
    server_name example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    client_max_body_size 10m;

    # Without stripping (no trailing slash on proxy_pass): the agent sees
    # /console/... and removes admin_base_path itself.
    location /console/ {
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/snippets/fluid-proxy.conf;
    }
    # With stripping (trailing slash): the agent sees /hooks/...; it still
    # needs webhook_base_path only if you also want unstripped access.
    location /hooks-gw/ {
        proxy_pass http://127.0.0.1:8081/;
        include /etc/nginx/snippets/fluid-proxy.conf;
    }
}

# The included snippet is deploy/nginx/fluid-proxy.conf (install as /etc/nginx/snippets/fluid-proxy.conf).

# ---------- C) forward proxy: TCP passthrough (in nginx.conf, outside http {}) ----------
# HTTP reverse proxying cannot carry CONNECT, so pass the proxy port through as TCP.
