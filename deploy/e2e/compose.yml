# End-to-end test: one fluid-agent behind nginx, Traefik and Caddy.
#   ./deploy/e2e/test.sh
services:
  agent:
    build: ../..
    volumes:
      - ./config.json:/app/config.json:ro
      - ./dynamic:/app/dynamic:ro
    networks: { e2e: { ipv4_address: 172.31.0.10 } }
  whoami:
    image: docker.io/traefik/whoami:latest
    networks: { e2e: {} }
  nginx:
    image: docker.io/library/nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./fluid-proxy.conf:/etc/nginx/fluid-proxy.conf:ro
    ports: ["127.0.0.1:28080:80", "127.0.0.1:28088:8080"]
    depends_on: [agent]
    networks: { e2e: {}, public: {} }
  traefik:
    image: docker.io/library/traefik:latest
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.proxy.address=:8080
      - --providers.file.filename=/etc/traefik/dynamic.yml
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports: ["127.0.0.1:38080:80", "127.0.0.1:38088:8080"]
    depends_on: [agent]
    networks: { e2e: {}, public: {} }
  caddy:
    image: docker.io/library/caddy:latest
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["127.0.0.1:48080:80"]
    depends_on: [agent]
    networks: { e2e: {}, public: {} }
  # A caller on a network only the proxies join: its address must be what the
  # agent records as the sender, never a proxy's address.
  client:
    image: docker.io/curlimages/curl:latest
    command: ["sleep", "3600"]
    networks: { public: { ipv4_address: 172.32.0.50 } }

  # ---- built-in TLS, no reverse proxy (certificate files) ----
  agent-tls:
    build: ../..
    volumes:
      - ./tls/agent-tls.json:/app/config.json:ro
      - ./dynamic:/app/dynamic:ro
      - ./.certs:/certs:ro
    ports: ["127.0.0.1:58080:8080", "127.0.0.1:58081:8081", "127.0.0.1:59000:9000"]
    networks: { e2e: { aliases: [tls.test] } }

  # ---- ACME against Pebble (Let's Encrypt's test CA) ----
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: ["-config", "/test/config/e2e.json"]
    environment: { PEBBLE_VA_NOSLEEP: "1", PEBBLE_WFE_NONCEREJECT: "0" }
    volumes: ["./tls/pebble-config.json:/test/config/e2e.json:ro"]
    networks: { e2e: {} }
  agent-acme-alpn:          # :443 -> TLS-ALPN-01
    build: ../..
    sysctls: { net.ipv4.ip_unprivileged_port_start: 0 }
    volumes:
      - ./tls/agent-acme-alpn.json:/app/config.json:ro
      - ./dynamic:/app/dynamic:ro
      - ./.certs:/certs:ro
    depends_on: [pebble]
    networks: { e2e: { aliases: [acme-alpn.test] } }
  agent-acme-http:          # :8443 + :80 challenge listener -> HTTP-01
    build: ../..
    sysctls: { net.ipv4.ip_unprivileged_port_start: 0 }
    volumes:
      - ./tls/agent-acme-http.json:/app/config.json:ro
      - ./dynamic:/app/dynamic:ro
      - ./.certs:/certs:ro
    depends_on: [pebble]
    networks: { e2e: { aliases: [acme-http.test] } }
  tester:                   # runs checks from inside the network
    image: docker.io/curlimages/curl:latest
    command: ["sleep", "3600"]
    networks: { e2e: {} }

networks:
  e2e:
    ipam: { config: [{ subnet: 172.31.0.0/24 }] }
  public:
    ipam: { config: [{ subnet: 172.32.0.0/24 }] }
