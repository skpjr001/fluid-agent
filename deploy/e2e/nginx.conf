# Same routing as deploy/nginx/fluid-agent.conf, on plain HTTP for testing.
events {}
http {
  server {
    listen 80;
    server_name hooks.test;
    location / { proxy_pass http://agent:8081; include /etc/nginx/fluid-proxy.conf; }
  }
  server {
    listen 80;
    server_name example.test;
    location /console/  { proxy_pass http://agent:9000;   include /etc/nginx/fluid-proxy.conf; }  # no stripping
    location /hooks-gw/ { proxy_pass http://agent:8081/;  include /etc/nginx/fluid-proxy.conf; }  # stripping
  }
}
stream {
  server { listen 8080; proxy_pass agent:8080; }
}
