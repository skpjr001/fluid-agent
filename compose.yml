# Webhook/ingest traffic goes through Traefik (TLS). The forward proxy and the
# admin UI/API stay off Traefik.
services:
  fluid-agent:
    build: .
    restart: unless-stopped
    environment:
      PROXY_ADMIN_TOKEN: ${PROXY_ADMIN_TOKEN:?set in .env}   # bootstrap editor token
    volumes:
      - ./config.json:/app/config.json:ro   # cp config.docker.json config.json
      - ./dynamic:/app/dynamic              # cp -r examples/dynamic dynamic, then edit
      - fluid-data:/app/data                # SQLite: logs, events, deliveries
    ports:
      - "8080:8080"                         # forward proxy + /forward - firewall to your IPs only!
      - "127.0.0.1:9000:9000"               # admin API + UI - localhost only (use an SSH tunnel)
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.http.routers.hooks.rule=Host(`hooks.example.com`)
      - traefik.http.routers.hooks.entrypoints=websecure
      - traefik.http.routers.hooks.tls.certresolver=le
      - traefik.http.services.hooks.loadbalancer.server.port=8081

volumes:
  fluid-data:

networks:
  traefik:
    external: true
