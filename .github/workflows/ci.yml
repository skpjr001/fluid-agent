name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no dependencies (no go.sum)

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: UI script syntax
        run: node --check ui/app.js

      - name: Example configs validate
        run: |
          go run . check -config config.example.json || true   # ./dynamic is git-ignored
          mkdir -p /tmp/fa && sed 's#"./dynamic"#"examples/dynamic"#' config.example.json > /tmp/fa/config.json
          go run . check -config /tmp/fa/config.json

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o fluid-agent .

      - name: Docker build
        run: docker build -t fluid-agent:ci .

  e2e:
    # fluid-agent behind real nginx, Traefik and Caddy: subdomain, path with
    # and without prefix stripping, console/API/SSE under a path, forward
    # proxy via TCP passthrough, and the real sender address through each proxy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: End-to-end behind reverse proxies
        run: ./deploy/e2e/test.sh
